<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>停车券 · 使用进度管理</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: #F2F3F5; color: #1A1B1C;
    padding: 16px 14px 34px; max-width: 720px; margin: 0 auto;
  }
  h1 { font-size: 20px; margin: 2px 0 2px; }
  .sub { color: #6B7280; font-size: 12.5px; margin-top: 2px; }
  .tip {
    background: #FFFBE6; border: 1px solid #FFE58F; color: #7A6212;
    font-size: 12.5px; line-height: 1.65; border-radius: 10px; padding: 9px 12px; margin: 12px 0 2px;
  }
  .progress-text { font-size: 13.5px; font-weight: 600; margin: 12px 0 6px; }
  .progress-track { height: 10px; background: #E8E8E8; border-radius: 6px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: #52C41A; border-radius: 6px; transition: width .3s; }
  .all-done {
    display: none; margin-top: 10px; background: #F6FFED; border: 1px solid #B7EB8F;
    color: #389E0D; font-size: 13px; font-weight: 600; border-radius: 10px; padding: 10px; text-align: center;
  }
  .grid { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
  .card {
    flex: 1 1 170px; min-width: 0; background: #fff; border-radius: 14px; padding: 12px 12px 14px;
    text-align: center; border: 1px solid #EBEBEB; position: relative;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04); transition: opacity .25s;
  }
  .card.used { opacity: .5; filter: grayscale(1); }
  .card.used .qr-img { opacity: .45; }
  .badge {
    position: absolute; top: 10px; right: 10px; background: #BFBFBF; color: #fff;
    font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 20px;
  }
  .badge.unused { background: #52C41A; }
  .qr-img { width: 100%; max-width: 232px; height: auto; display: block; margin: 4px auto 0; border-radius: 8px; }
  .serial { font-size: 11px; color: #6B7280; margin-top: 8px; word-break: break-all; line-height: 1.4; }
  .hint { font-size: 11px; color: #9AA0A6; margin-top: 3px; }
  .used-time { font-size: 11px; color: #8C8C8C; margin-top: 3px; }
  .mark-btn {
    margin-top: 10px; width: 100%; padding: 12px 0; border: none; border-radius: 10px;
    font-size: 14px; font-weight: 600; background: #1677FF; color: #fff; cursor: pointer;
  }
  .mark-btn:active { opacity: .8; }
  .card.used .mark-btn { background: #EEEEEE; color: #6B7280; }
  .footer { display: flex; gap: 10px; margin-top: 22px; }
  .footer button {
    flex: 1; padding: 12px 0; border-radius: 10px; border: 1px solid #D9D9D9;
    background: #fff; font-size: 13px; color: #1A1B1C; cursor: pointer;
  }
  .footer .danger { color: #E5484D; border-color: #F0C4C6; }
  .foot-note { text-align: center; font-size: 11px; color: #9AA0A6; margin-top: 14px; line-height: 1.6; }

  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none;
    align-items: center; justify-content: center; z-index: 99; padding: 20px;
  }
  .modal-mask.show { display: flex; }
  .modal-box { background: #fff; border-radius: 14px; width: 100%; max-width: 300px; padding: 20px 18px 14px; text-align: center; }
  .modal-title { font-size: 16px; font-weight: 600; }
  .modal-text { font-size: 13px; color: #6B7280; margin-top: 8px; line-height: 1.55; }
  .modal-btns { display: flex; gap: 10px; margin-top: 18px; }
  .modal-btns button { flex: 1; padding: 12px 0; border-radius: 9px; font-size: 14px; border: none; cursor: pointer; }
  .modal-cancel { background: #F2F3F5; color: #1A1B1C; }
  .modal-ok { background: #1677FF; color: #fff; font-weight: 600; }
  .modal-ok.danger { background: #E5484D; }

  .zoom-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.92);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    z-index: 999; padding: 20px;
  }
  .zoom-mask.show { display: flex; }
  .zoom-mask img { max-width: 86%; max-height: 68%; border-radius: 10px; background: #fff; }
  .zoom-tip { color: #fff; font-size: 13px; margin-top: 16px; text-align: center; line-height: 1.6; }
  .zoom-close { position: absolute; top: 12px; right: 18px; color: #fff; font-size: 30px; line-height: 1; }

</style>
</head>
<body>
  <h1>停车券 · 9 张</h1>
  <div class="sub">用一张、标记一张，不怕搞混</div>
  <div class="tip">使用方法：<b>长按二维码</b> → 微信弹出「识别图中二维码」→ 完成停车缴费。缴费成功后，点下方<b>「标记已用」</b>，该券会自动变灰。</div>

  <div class="progress-text" id="progressText">已用 0 / 9 · 剩余 9 张</div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="all-done" id="allDone">全部 9 张券都已使用 ✓</div>

  <div class="grid" id="grid"></div>

  <div class="footer">
    <button id="exportBtn">导出备份</button>
    <button id="importBtn">导入备份</button>
    <button id="resetBtn" class="danger">重置全部</button>
    <input type="file" id="fileInput" accept="application/json,.json" style="display:none;">
  </div>
  <div class="foot-note">标记状态自动保存在本机浏览器；换设备或清缓存前，可先「导出备份」。</div>

  <div class="modal-mask" id="modalMask">
    <div class="modal-box">
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-text" id="modalText"></div>
      <div class="modal-btns">
        <button class="modal-cancel" id="modalCancel">取消</button>
        <button class="modal-ok" id="modalOk">确认</button>
      </div>
    </div>
  </div>


  <div class="zoom-mask" id="zoomMask">
    <div class="zoom-close" id="zoomClose">×</div>
    <img id="zoomImg" src="" alt="二维码大图">
    <div class="zoom-tip">长按上方二维码 → 微信弹出「识别图中二维码」缴费<br>点空白处关闭</div>
  </div>

<script>

(function(){
  "use strict";
  var LS_KEY = "parking_coupons_v1";
  var IMAGES = [{"s":"11178814580886812","d":"qr/11178814580886812.png"},{"s":"11178814580887012","d":"qr/11178814580887012.png"},{"s":"11178814580887112","d":"qr/11178814580887112.png"},{"s":"11178814580887212","d":"qr/11178814580887212.png"},{"s":"11178814580887312","d":"qr/11178814580887312.png"},{"s":"11178814580887412","d":"qr/11178814580887412.png"},{"s":"11178814580887512","d":"qr/11178814580887512.png"},{"s":"11178814580887612","d":"qr/11178814580887612.png"},{"s":"11178814580887712","d":"qr/11178814580887712.png"}];

  var state = { used: {} };
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (raw) {
      var p = JSON.parse(raw);
      if (p && typeof p.used === "object") state = p;
    }
  } catch (e) {}

  var grid = document.getElementById("grid");
  var modalMask = document.getElementById("modalMask");
  var modalTitle = document.getElementById("modalTitle");
  var modalText = document.getElementById("modalText");
  var modalOk = document.getElementById("modalOk");
  var modalOnOk = null;

  var zoomMask = document.getElementById("zoomMask");
  var zoomImg = document.getElementById("zoomImg");
  function openZoom(src) { zoomImg.src = src; zoomMask.classList.add("show"); }
  document.getElementById("zoomClose").addEventListener("click", function () {
    zoomMask.classList.remove("show");
  });
  zoomMask.addEventListener("click", function (ev) {
    if (ev.target === zoomMask) zoomMask.classList.remove("show");
  });

  function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }

  function showConfirm(title, text, okLabel, okClass, onOk) {
    modalTitle.textContent = title;
    modalText.textContent = text;
    modalOk.textContent = okLabel;
    modalOk.className = "modal-ok" + (okClass ? " " + okClass : "");
    modalOnOk = onOk || null;
    modalMask.classList.add("show");
  }

  document.getElementById("modalCancel").addEventListener("click", function () {
    modalMask.classList.remove("show");
  });
  modalOk.addEventListener("click", function () {
    modalMask.classList.remove("show");
    if (modalOnOk) modalOnOk();
  });
  modalMask.addEventListener("click", function (ev) {
    if (ev.target === modalMask) modalMask.classList.remove("show");
  });

  function toggle(idx) {
    var c = IMAGES[idx];
    var used = !!state.used[c.s];
    if (!used) {
      showConfirm("确认这张已使用？", "编号 " + c.s + " 这张券使用后将变灰，并计入「已用」数量。如果还没用，请点取消。",
        "确认已用", "", function () {
          state.used[c.s] = new Date().toLocaleString("zh-CN", { hour12: false });
          save(); render();
        });
    } else {
      showConfirm("撤销标记？", "将编号 " + c.s + " 恢复为「未使用」状态（重新变亮）。", "撤销", "danger", function () {
        delete state.used[c.s];
        save(); render();
      });
    }
  }

  function render() {
    grid.innerHTML = "";
    IMAGES.forEach(function (c, idx) {
      var used = !!state.used[c.s];
      var card = document.createElement("div");
      card.className = "card" + (used ? " used" : "");

      var badge = document.createElement("div");
      badge.className = "badge" + (used ? "" : " unused");
      badge.textContent = used ? "已使用" : "未用";

      var img = document.createElement("img");
      img.className = "qr-img"; img.src = c.d; img.alt = "二维码" + c.s;
      img.addEventListener("click", function () { openZoom(c.d); });

      var serial = document.createElement("div");
      serial.className = "serial"; serial.textContent = "编号 " + c.s;

      var hint = document.createElement("div");
      if (used) {
        hint.className = "used-time";
        hint.textContent = "已用：" + state.used[c.s];
      } else {
        hint.className = "hint";
        hint.textContent = "长按识别使用";
      }

      var btn = document.createElement("button");
      btn.className = "mark-btn";
      btn.textContent = used ? "撤销标记" : "标记已用";
      btn.addEventListener("click", function () { toggle(idx); });

      card.appendChild(badge);
      card.appendChild(img);
      card.appendChild(serial);
      card.appendChild(hint);
      card.appendChild(btn);
      grid.appendChild(card);
    });

    var n = Object.keys(state.used).length;
    document.getElementById("progressText").textContent =
      "已用 " + n + " / " + IMAGES.length + " · 剩余 " + (IMAGES.length - n) + " 张";
    document.getElementById("progressFill").style.width = (n / IMAGES.length * 100).toFixed(1) + "%";
    document.getElementById("allDone").style.display = (n === IMAGES.length) ? "block" : "none";
  }

  document.getElementById("exportBtn").addEventListener("click", function () {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "停车券状态备份.json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });

  var fileInput = document.getElementById("fileInput");
  document.getElementById("importBtn").addEventListener("click", function () { fileInput.click(); });
  fileInput.addEventListener("change", function () {
    var f = fileInput.files && fileInput.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function (ev) {
      fileInput.value = "";
      try {
        var p = JSON.parse(ev.target.result);
        if (!p || typeof p !== "object" || !p.used) throw new Error("bad format");
        showConfirm("导入备份？", "将用备份文件中的使用状态覆盖当前状态。", "导入", "", function () {
          var ns = { used: {} };
          Object.keys(p.used).forEach(function (k) {
            if (IMAGES.some(function (c) { return c.s === k; })) ns.used[k] = p.used[k];
          });
          state = ns; save(); render();
        });
      } catch (e2) {
        showConfirm("导入失败", "文件格式不正确，请选择之前导出的备份文件（.json）。", "知道了", "", function () {});
      }
    };
    reader.readAsText(f);
  });

  document.getElementById("resetBtn").addEventListener("click", function () {
    showConfirm("重置全部？", "将清空所有券的使用标记，恢复到全部未使用。此操作不可撤销。", "重置", "danger", function () {
      state = { used: {} }; save(); render();
    });
  });

  render();
})();
</script>
</body>
</html>
